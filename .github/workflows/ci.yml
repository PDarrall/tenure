name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:core

  validation:
    # The population targets in DESIGN.md are asserted by
    # packages/engine/test/population.test.ts. Until the model is tuned this
    # job is allowed to fail so the raw numbers stay visible without blocking
    # every push. Remove `continue-on-error` once the targets pass.
    name: Validation targets (allowed to fail until tuned)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:validation
